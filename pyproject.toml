[project]
name = "platonic-universe"
version = "0.1.0"
description = "Scripts to test the Platonic Representation Hypothesis on astronomical data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "astropt>=2.0.5",
    "llvmlite>=0.44.0",
    "numpy>=2.3.2",
    "opencv-python>=4.11.0.86",
    "pillow>=11.3.0",
    "polars>=1.32.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.0",
    "torch>=2.8.0",
    "transformers>=4.55.0",
    "pybind11>=3.0.1",
    "pytest>=8.0.0",
    "calibrated-similarity>=0.1.1",
    "accelerate>=1.13.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
sam2 = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git"]
aion = ["polymathic-aion"]
# Time-series foundation models. chronos-forecasting is compatible with this
# repo's modern transformers. MOMENT (momentfm) pins transformers==4.33.3 and
# must be installed in a dedicated environment (see pu.models.timeseries).
timeseries = ["chronos-forecasting>=1.4.0"]
# Moirai (Salesforce) time-series foundation model. PatchTST / PatchTSMixer need
# no extra: they ship inside the pinned transformers.
moirai = ["uni2ts>=1.1.0"]
# Spectra foundation model. Spender loads weights via torch.hub, not HuggingFace.
spectra = ["spender>=0.3"]
# Tabular foundation model. TabPFN weights are gated on HuggingFace (accept terms).
tabular = ["tabpfn>=2.0", "tabpfn-extensions"]
# Triple co-location analysis (Experiment 2). The core primitives in
# pu.metrics.colocation only need numpy + scikit-learn (already core deps); this
# extra adds the notebook stack. dadapy is an OPTIONAL backend and is left out on
# purpose: its Cython extension does not build against numpy>=2 (this repo pins
# numpy>=2.3), so the pure-numpy overlap path is the default. To use the dadapy
# backend, install dadapy in a separate numpy<2 environment.
colocation = [
    "matplotlib>=3.9.0",
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
]
cosmosweb = [
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
]
platonic-compute = [
    "huggingface-hub>=0.20.0",
    "pynndescent>=0.5.0",
    "umap-learn>=0.5.0",
    "faiss-cpu>=1.8.0",
    "tqdm>=4.66.0",
]
platonic-extract = [
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
]
platonic-regress = [
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "umap-learn>=0.5.0",
    "pynndescent>=0.5.0",
    "faiss-cpu>=1.8.0",
    "scipy>=1.10.0",
]

[build-system]  
requires = ["setuptools>=42", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project.scripts]
pu = "pu.__main__:main"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
package = true

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers.git" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/pu"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end tests that download real model weights (opt in with PU_RUN_SLOW=1)",
]
